[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospitality-sustainability-ai"
version = "0.1.0"
description = "Explainable AI for hospitality resource-use prediction and anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Akshith Moharampudi"}]
license = "MIT"
keywords = ["explainable-ai", "hospitality", "sustainability", "energy", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
generate-hospitality-data = "hospitality_ai.synthetic_data:main"
evaluate-baseline = "hospitality_ai.baseline:main"
train-electricity-model = "hospitality_ai.linear_model:main"
detect-electricity-anomalies = "hospitality_ai.anomaly:main"
explain-electricity-alert = "hospitality_ai.explain:main"
recommend-electricity-action = "hospitality_ai.recommend:main"
test-decision-weights = "hospitality_ai.decision_sensitivity:main"
show-prediction-range = "hospitality_ai.uncertainty:main"
plot-model-evaluation = "hospitality_ai.evaluation_chart:main"
plot-generalisation-error = "hospitality_ai.generalisation_chart:main"
evaluate-newest-month = "hospitality_ai.temporal_validation:main"
evaluate-unseen-venue = "hospitality_ai.venue_validation:main"
prepare-bdg2-hospitality-data = "hospitality_ai.bdg2_real_data:main"
evaluate-bdg2-real-data = "hospitality_ai.real_data_evaluation:main"
validate-bdg2-models = "hospitality_ai.rolling_validation:main"
plot-bdg2-real-data = "hospitality_ai.real_data_chart:main"
diagnose-bdg2-venues = "hospitality_ai.real_data_diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]
