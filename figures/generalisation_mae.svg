<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">Baseline and regression MAE across evaluation designs</title>
<desc id="desc">For each unseen-data evaluation, the blue regression-model bar is lower than the grey mean-baseline bar. All results use synthetic data.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="34" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#172033">Generalisation error across evaluation designs</text>
<text x="450" y="58" text-anchor="middle" font-family="Arial" font-size="13" fill="#536078">Lower MAE is better; reproducible synthetic learning data</text>
<rect x="100" y="110" width="755" height="385" fill="#f8fafc" stroke="#aab4c3"/>
<line x1="100" y1="495.0" x2="855" y2="495.0" stroke="#dfe4ea"/>
