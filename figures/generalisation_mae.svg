<line x1="100" y1="418.0" x2="855" y2="418.0" stroke="#dfe4ea"/>
<text x="88" y="422.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">24</text>
<line x1="100" y1="341.0" x2="855" y2="341.0" stroke="#dfe4ea"/>
<text x="88" y="345.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">49</text>
<line x1="100" y1="264.0" x2="855" y2="264.0" stroke="#dfe4ea"/>
<text x="88" y="268.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">73</text>
<line x1="100" y1="187.0" x2="855" y2="187.0" stroke="#dfe4ea"/>
<text x="88" y="191.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">97</text>
<line x1="100" y1="110.0" x2="855" y2="110.0" stroke="#dfe4ea"/>
<text x="88" y="114.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">122</text>
<rect x="158.8" y="250.8" width="62" height="244.2" fill="#7b8794"/>
<text x="189.8" y="242.8" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#172033">77.3</text>
