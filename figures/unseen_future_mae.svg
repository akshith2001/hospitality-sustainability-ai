<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">Unseen hospitality venues tested on future periods</title>
<desc id="desc">Grouped bars compare a same-type earlier-period mean baseline with a venue-independent seasonal linear model. Lower mean absolute error is better.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="540" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#17324d">Unseen venues + future periods</text>
<text x="540" y="66" text-anchor="middle" font-family="Arial" font-size="14" fill="#5f6b73">Newest 60 eligible dates; no held-out-building or future-period leakage</text>
<rect x="100" y="125" width="925" height="375" fill="#f8fafc" stroke="#b7c2cc"/>
<line x1="100" y1="500.0" x2="1025" y2="500.0" stroke="#dfe4ea"/>
<text x="88" y="504.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">0</text>
<line x1="100" y1="425.0" x2="1025" y2="425.0" stroke="#dfe4ea"/>
<text x="88" y="429.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">228</text>
<line x1="100" y1="350.0" x2="1025" y2="350.0" stroke="#dfe4ea"/>
<text x="88" y="354.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">457</text>
<line x1="100" y1="275.0" x2="1025" y2="275.0" stroke="#dfe4ea"/>
<text x="88" y="279.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">685</text>
<line x1="100" y1="200.0" x2="1025" y2="200.0" stroke="#dfe4ea"/>
<text x="88" y="204.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">913</text>
<line x1="100" y1="125.0" x2="1025" y2="125.0" stroke="#dfe4ea"/>
<text x="88" y="129.0" text-anchor="end" font-family="Arial" font-size="12" fill="#48566a">1141</text>
<rect x="218.2" y="283.6" width="105" height="216.4" fill="#788896"/>
<text x="270.8" y="275.6" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#17324d">658.50</text>
<rect x="339.2" y="371.9" width="105" height="128.1" fill="#138a8a"/>
<text x="391.8" y="363.9" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#17324d">389.82</text>
<text x="331.2" y="528" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#17324d">Food-service venue</text>
<text x="331.2" y="551" text-anchor="middle" font-family="Arial" font-size="13" fill="#138a8a">40.8% lower MAE</text>
<rect x="680.8" y="165.2" width="105" height="334.8" fill="#788896"/>
<text x="733.2" y="157.2" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#17324d">1019.06</text>
<rect x="801.8" y="333.7" width="105" height="166.3" fill="#138a8a"/>
<text x="854.2" y="325.7" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#17324d">506.20</text>
<text x="793.8" y="528" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#17324d">Hotel</text>
<text x="793.8" y="551" text-anchor="middle" font-family="Arial" font-size="13" fill="#138a8a">50.3% lower MAE</text>
<rect x="355" y="88" width="17" height="17" fill="#788896"/>
<text x="382" y="102" font-family="Arial" font-size="14" fill="#17324d">Same-type baseline</text>
<rect x="565" y="88" width="17" height="17" fill="#138a8a"/>
<text x="592" y="102" font-family="Arial" font-size="14" fill="#17324d">Linear model</text>
<text x="27" y="312.5" text-anchor="middle" transform="rotate(-90 27 312.5)" font-family="Arial" font-size="15" fill="#17324d">MAE (kWh/day; lower is better)</text>
<text x="540" y="596" text-anchor="middle" font-family="Arial" font-size="12" fill="#5f6b73">Source: BDG2 v1.0. Results are predictive, not verified energy savings.</text>
</svg>