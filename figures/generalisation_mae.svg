<text x="441.5" y="152.2" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#172033">105.9</text>
<rect x="482.5" y="397.4" width="62" height="97.6" fill="#2672b8"/>
<text x="513.5" y="389.4" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#172033">30.9</text>
<text x="477.5" y="523" text-anchor="middle" font-family="Arial" font-size="13" fill="#172033">Newest 30 days</text>
<rect x="662.2" y="253.6" width="62" height="241.4" fill="#7b8794"/>
<text x="693.2" y="245.6" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#172033">76.4</text>
